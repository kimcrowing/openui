name: Build & Deploy OpenCode Web UI

# 基于官方 opencode packages/app（上游 dev 分支 = V2 版 web UI）构建。
# webui-src/packages/app 只保留本仓库的 overlay 覆盖文件（vite.config、
# entry.tsx / prefixed-router / titlebar / index.css），CI 把上游 dev 的完整
# packages/app clone 下来作为基线，再用这些文件合并覆盖（不删除上游文件）。
# 产出分发到 GitHub Pages（子路径 /openui/ 部署，VITE_BASE 处理资产路径，
# SPA fallback: dist/index.html 复制为 404.html 以便 history 路由刷新可加载）。

on:
  push:
    branches: [main, master]
    paths:
      - 'webui-src/**'
      - '.github/workflows/build-webui.yml'
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: 'Upstream opencode ref to base on (branch / tag / commit SHA)'
        required: false
        default: 'dev'

concurrency:
  group: webui-build
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

env:
  UPSTREAM_REF: ${{ github.event.inputs.upstream_ref || 'dev' }}
  VITE_BASE: '/openui/'
  VITE_DEFAULT_SERVER_URL: 'https://kimcrowing.dynv6.net:14096'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout this repo (overlay)
        uses: actions/checkout@v4
        with:
          path: repo

      - name: Clone upstream opencode
        run: |
          # Default clone (HEAD = dev), then fetch the requested ref so a branch,
          # tag or commit SHA all work. Shallow, single ref.
          git clone --depth 1 https://github.com/anomalyco/opencode.git "$RUNNER_TEMP/upstream"
          cd "$RUNNER_TEMP/upstream"
          git fetch --depth 1 origin "$UPSTREAM_REF"
          git checkout -q FETCH_HEAD
          echo "== upstream HEAD =="
          git log -1 --format='%H %s'

      - name: Apply overlay onto packages/app
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/upstream/packages/app"
          # Merge-overlay: copy only our overlay files onto the upstream baseline
          # (upstream provides the full packages/app, including package.json/bunfig).
          cp -a "$GITHUB_WORKSPACE/repo/webui-src/packages/app/." "$APP/"
          echo "== overlay files staged =="
          find "$GITHUB_WORKSPACE/repo/webui-src/packages/app" -type f | sed "s|$GITHUB_WORKSPACE/repo/webui-src/packages/app/||" | sort
          echo "== sanity checks =="
          test -f "$APP/src/index.css" && echo "index.css ok" || (echo "index.css MISSING"; exit 1)
          test -f "$APP/src/router/prefixed-router.tsx" && echo "prefixed-router ok" || (echo "prefixed-router MISSING"; exit 1)
          test -f "$APP/package.json" && echo "upstream package.json ok" || (echo "upstream package.json MISSING"; exit 1)
          test -f "$APP/vendor/opencode-ai-client-1.17.13-v2.tgz" && echo "vendor tgz ok" || (echo "vendor tgz MISSING (upstream changed?)"; ls "$APP/vendor" 2>/dev/null || true)

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Cache bun deps
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            ${{ runner.temp }}/upstream/node_modules
            ${{ runner.temp }}/upstream/packages/*/node_modules
          key: ${{ runner.os }}-bun-v2-${{ env.UPSTREAM_REF }}-${{ hashFiles('webui-src/**') }}

      - name: Install upstream deps
        working-directory: ${{ runner.temp }}/upstream
        run: |
          bun install --ignore-scripts --frozen-lockfile

      - name: Build web app
        working-directory: ${{ runner.temp }}/upstream/packages/app
        run: |
          bun run build

      - name: Stage Pages artifact
        run: |
          set -euo pipefail
          DIST="$RUNNER_TEMP/upstream/packages/app/dist"
          STAGE="$RUNNER_TEMP/stage"
          mkdir -p "$STAGE"
          cp -a "$DIST/." "$STAGE/"
          # SPA fallback: any path under /openui/ returns index.html (history routing)
          cp "$STAGE/index.html" "$STAGE/404.html"
          echo "== staged =="
          find "$STAGE" -maxdepth 2 -type f | sed "s|$STAGE/||" | sort | awk 'NR<=40'
          echo "== total size =="
          du -sh "$STAGE"

      - name: Upload Pages artifact
        uses: actions/configure-pages@v5
        id: configure

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/stage

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4