name: Build & Deploy OpenCode Web UI

# 基于官方 opencode packages/app（上游 v2 分支 = V2 版 web UI，vite 8.x/rolldown）。
# webui-src/packages/app 只保留本仓库的 overlay 覆盖文件（vite.config、
# vite.icons / index.html / entry.tsx / app.tsx / platform/web.ts），CI 把上游
# v2 分支的完整 packages/app clone 下来作为基线，再用这些文件合并覆盖
# （不删除上游文件）。产出分发到 GitHub Pages（子路径 /openui/ 部署，
# VITE_BASE 处理资产路径，SPA fallback: dist/index.html 复制为 404.html 以便
# history 路由刷新可加载）。
# 历史：此前误用 dev 分支（V1 线，vite 7/rollup）导致 UI 非 V2 形态；
# v2 分支 packages/app 用 vite 8.2.2（rolldown 后端，_assets 多 chunk）才是
# 官方 V2 真身（与本机 opencode2 内嵌 UI 一致）。

on:
  push:
    branches: [main, master]
    paths:
      - 'webui-src/**'
      - '.github/workflows/build-webui.yml'
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: 'Upstream opencode ref to base on (branch / tag / commit SHA)'
        required: false
        default: 'v2'

concurrency:
  group: webui-build
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

env:
  UPSTREAM_REF: ${{ github.event.inputs.upstream_ref || 'v2' }}
  VITE_BASE: '/openui/'
  VITE_DEFAULT_SERVER_URL: 'https://kimcrowing.dynv6.net:14096'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout this repo (overlay)
        uses: actions/checkout@v4
        with:
          path: repo

      - name: Clone upstream opencode
        run: |
          # Default clone (HEAD = v2), then fetch the requested ref so a branch,
          # tag or commit SHA all work. Shallow, single ref.
          git clone --depth 1 https://github.com/anomalyco/opencode.git "$RUNNER_TEMP/upstream"
          cd "$RUNNER_TEMP/upstream"
          git fetch --depth 1 origin "$UPSTREAM_REF"
          git checkout -q FETCH_HEAD
          echo "== upstream HEAD =="
          git log -1 --format='%H %s'

      - name: Apply overlay onto packages/app
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/upstream/packages/app"
          # Merge-overlay: copy only our overlay files onto the upstream baseline
          # (upstream provides the full packages/app, including package.json/bunfig).
          cp -a "$GITHUB_WORKSPACE/repo/webui-src/packages/app/." "$APP/"
          echo "== overlay files staged =="
          find "$GITHUB_WORKSPACE/repo/webui-src/packages/app" -type f | sed "s|$GITHUB_WORKSPACE/repo/webui-src/packages/app/||" | sort
          echo "== sanity checks =="
          test -f "$APP/src/index.css" && echo "index.css ok" || (echo "index.css MISSING"; exit 1)
          test -f "$APP/src/app.tsx" && echo "app.tsx ok" || (echo "app.tsx MISSING"; exit 1)
          test -f "$APP/src/runtime/platform/web.ts" && echo "platform/web.ts ok" || (echo "platform/web.ts MISSING"; exit 1)
          test -f "$APP/package.json" && echo "upstream package.json ok" || (echo "upstream package.json MISSING"; exit 1)
          # v2 分支是 workspace monorepo：@opencode/ui、@opencode/client 等由 packages/ 提供
          test -f "$APP/vite.pwa.ts" && echo "vite.pwa.ts ok (upstream)" || (echo "vite.pwa.ts MISSING"; exit 1)
          test -f "$(dirname $(dirname "$APP"))/client/package.json" && echo "@opencode/client workspace ok" || (echo "@opencode/client workspace MISSING (upstream structure changed?)"; ls "$(dirname $(dirname "$APP"))" 2>/dev/null || true)

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Cache bun deps
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            ${{ runner.temp }}/upstream/node_modules
            ${{ runner.temp }}/upstream/packages/*/node_modules
          key: ${{ runner.os }}-bun-v2-${{ env.UPSTREAM_REF }}-${{ hashFiles('webui-src/**') }}

      - name: Install upstream deps
        working-directory: ${{ runner.temp }}/upstream
        run: |
          bun install --ignore-scripts --frozen-lockfile

      - name: Build web app
        working-directory: ${{ runner.temp }}/upstream/packages/app
        run: |
          bun run build

      - name: Stage Pages artifact
        run: |
          set -euo pipefail
          DIST="$RUNNER_TEMP/upstream/packages/app/dist"
          STAGE="$RUNNER_TEMP/stage"
          mkdir -p "$STAGE"
          cp -a "$DIST/." "$STAGE/"
          # SPA fallback: any path under /openui/ returns index.html (history routing)
          cp "$STAGE/index.html" "$STAGE/404.html"
          echo "== staged =="
          find "$STAGE" -maxdepth 2 -type f | sed "s|$STAGE/||" | sort | awk 'NR<=40'
          echo "== total size =="
          du -sh "$STAGE"

      - name: Upload Pages artifact
        uses: actions/configure-pages@v5
        id: configure

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/stage

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4